<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guitar World - Catalog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Pirata+One&family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body class="gallery-page">
    <div class="wrapper">
        <header>
            <img class="header-banner" src="images/header.jpg" alt="Guitar banner" />
            <div class="header-content-overlay">
                <img class="guitar-icon" src="images/logo_2.png" alt="Guitar symbol" />
                <h1>The World Of Guitars</h1>
            </div>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
            <div class="cart-container">
                <span class="cart-icon">🛒</span>
                <span id="cart-count">0</span>
            </div>
        </nav>

        <main>
            <h2>Our Catalog</h2>
            <p>Select your favorite model to add it to your collection!</p>
            
            <section class="gallery-grid">
                <figure class="gallery-item">
                    <img src="images/flyingV.jpg" alt="Flying V">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$2199</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/hollow.jpg" alt="Hollow Body">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$1850</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/lesPaul.jpg" alt="Les Paul">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$2499</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/martin.jpg" alt="Martin Acoustic">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$3200</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/sg.jpg" alt="SG Standard">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$1599</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/strat.jpg" alt="Stratocaster">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$1299</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/yamaha.jpg" alt="Yamaha Acoustic">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$899</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img src="images/taylor.jpg" alt="Taylor Acoustic">
                    <button class="add-to-cart">+</button>
                    <figcaption class="prices">$2750</figcaption>
                </figure>
            </section>
        </main>

		<footer>
			<h2>Contact/Sources</h2>
			<p>Created by Daniel Martinez</p>
			<div class="sources">
				<ul class="sources-list">
					<li><a href="https://www.guitarworld.com" target="_blank">Guitar World</a>
					</li>
					<li><a href="https://guitar.com" target="_blank">Guitar.com</a></li>
					<li><a href="https://www.premierguitar.com" target="_blank">Premier
							Guitar</a></li>
					<li><a href="https://acousticguitar.com" target="_blank">Acoustic
							Guitar</a></li>
					<li><a href="https://findmyguitar.com" target="_blank">FindMyGuitar</a>
					</li>
					<li><a href="https://en.wikipedia.org/" target="_blank">Wikipedia</a></li>
				</ul>
			</div>
		</footer>

	</div>
<script>
    let count = 0;
    const countDisplay = document.getElementById('cart-count');
    const buttons = document.querySelectorAll('.add-to-cart');

    buttons.forEach(button => {
        button.addEventListener('click', () => {
            count++;
            countDisplay.innerText = count;
            countDisplay.style.color = "white";
            setTimeout(() => { countDisplay.style.color = "#f1c40f"; }, 200);
        });
    });
</script>
</body>

</html>
